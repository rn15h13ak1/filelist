<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLE}}
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <div class="meta">
    生成日時: {{GENERATED_AT}} ・ 全件: <span id="totalCount">{{TOTAL}}</span><span class="status" id="visibleStatus"></span>
    <span class="error-banner" id="errorBanner">⚠ <span id="errorBannerCount"></span> 件のアクセスエラー <a id="errorBannerLink">詳細を見る</a></span>
    <div class="targets-list" id="targetsList"></div>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="ファイル名・パスで検索...">
    <select id="extFilter"><option value="">すべての拡張子</option></select>
    <select id="typeFilter">
      <option value="">種別: すべて</option>
      <option value="folder">フォルダのみ</option>
      <option value="file">ファイルのみ</option>
      <option value="symlink">リンクのみ</option>
    </select>
    <label class="show-errored-toggle" title="アクセスエラーが出たフォルダもメイン一覧に表示する">
      <input type="checkbox" id="showErrored"> 不可も表示
    </label>
    <label class="show-errored-toggle" title="除外パターンに一致したフォルダもメイン一覧に表示する">
      <input type="checkbox" id="showExcluded"> 除外も表示
    </label>
    <div class="view-toggle" role="tablist">
      <button data-view="tree" class="active" type="button">ツリー</button>
      <button data-view="table" type="button">テーブル</button>
    </div>
    <select id="depthExpand" title="指定した深さまで展開">
      <option value="">深さで展開...</option>
      <option value="1">深さ 1</option>
      <option value="2">深さ 2</option>
      <option value="3">深さ 3</option>
      <option value="5">深さ 5</option>
      <option value="all">全展開</option>
    </select>
    <button id="collapseAll" type="button">全折りたたみ</button>
    <button id="columnSettings" type="button" title="表示列の切替">表示列</button>
    <button id="csvExport" type="button" title="現在のフィルタ結果を CSV としてダウンロード">CSV</button>
  </div>
  <div id="columnPanel" class="column-panel" hidden>
    <strong>表示列</strong>
    <label><input type="checkbox" data-col="type" checked> 種別</label>
    <label><input type="checkbox" data-col="ext" checked> 拡張子</label>
    <label><input type="checkbox" data-col="size" checked> サイズ</label>
    <label><input type="checkbox" data-col="count" checked> アイテム数</label>
    <label><input type="checkbox" data-col="mtime" checked> 更新日時</label>
    <label><input type="checkbox" data-col="path" checked> パス</label>
  </div>
</header>
<div id="perfWarn">大量のアイテム（<span id="perfCount"></span>）が含まれています。検索やフィルタを活用してください。</div>
<main>
  <div id="treeView" class="view active"></div>
  <div id="tableView" class="view">
    <div id="tableBuildProgress" class="table-build-progress" style="display:none">テーブル準備中...</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name">名前</th>
            <th data-sort="type">種別</th>
            <th data-sort="ext">拡張子</th>
            <th data-sort="size">サイズ</th>
            <th data-sort="count">アイテム数</th>
            <th data-sort="mtime">更新日時</th>
            <th data-sort="path">パス</th>
            <th class="actions-head">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
  <div id="errorBox"></div>
</main>
<dialog id="modal" aria-labelledby="modalTitle">
  <div class="modal-header">
    <h2 id="modalTitle"></h2>
    <button type="button" class="modal-close" aria-label="閉じる">&times;</button>
  </div>
  <div class="modal-body">
    <dl id="modalBody"></dl>
  </div>
</dialog>
<script id="data" type="application/json">{{DATA_JSON}}</script>
<script>
{{SCRIPT}}
</script>
</body>
</html>
